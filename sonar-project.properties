# ===== SonarQube configuration for Apotheca monorepo =====
# Project key must match the project created in your SonarQube instance.

sonar.projectKey=Apotheca

# Display name shown in the SonarQube UI
sonar.projectName=Apotheca

sonar.projectDescription=Self-hosted pharmacy management system (FastAPI + React + Expo)

# Use git revision as analysis version for traceability (set by the scanner action)
sonar.scm.provider=git

# ---- Source paths (relative to repo root) ----
sonar.sources=apps/api/src,apps/web/src,apps/mobile/src,packages/shared/src

# ---- Test paths ----
sonar.tests=apps/api/tests

# ---- Coverage report paths ----
# Python (pytest-cov) + TS/JS (lcov via vite-plugin-coverage if added)
sonar.python.coverage.reportPaths=apps/api/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info

# ---- Language of source files (auto-detected; restrict for clarity) ----
sonar.language=py,ts,tsx,js,jsx

# ---- Exclusions ----
# Generated files, build output, icons, migrations, lockfiles, config
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.expo/**,\
  **/.expo-shared/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/android/**,\
  **/ios/**,\
  **/gradle/**,\
  **/alembic/versions/**,\
  apps/api/src/apotheca_api/seed.py,\
  **/index.ts

# ---- Coverage exclusions ----
# Entry points, generated code, platform shims and migrations contribute no
# meaningful logic and skew coverage percentages, so exclude them from the metric.
sonar.coverage.exclusions=\
  **/*.config.*,\
  **/vite.config.*,\
  **/craco.config.*,\
  **/babel.config.*,\
  **/metro.config.*,\
  **/tailwind.config.*,\
  **/postcss.config.*,\
  **/scripts/**,\
  **/alembic/**,\
  apps/api/src/apotheca_api/seed.py,\
  apps/api/src/apotheca_api/app.py,\
  apps/web/src/main.tsx

# ---- Duplicate detection ----
# Vendor-ish generated tabs and shared types may legitimately repeat structure.
sonar.cpd.exclusions=\
  **/tabIcons/**,\
  packages/shared/src/index.ts

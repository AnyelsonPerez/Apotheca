[project]
name = "apotheca-api"
version = "0.1.0"
description = "Apotheca - Self-hosted pharmacy management API"
authors = [
    { name = "Anyelson Pérez Pérez", email = "anyelson.perez@plainconcepts.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "argon2-cffi>=23.0.0",
    "pyjwt>=2.0.0",
    "httpx>=0.27.0",
    "email-validator>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apotheca_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

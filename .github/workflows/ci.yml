name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --tb=short -v

      - name: Run type checks
        run: uv run pyright

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @apotheca/web exec vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: pnpm --filter @apotheca/web build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @apotheca/mobile exec vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mobile
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Type check
        run: pnpm --filter @apotheca/mobile exec tsc --noEmit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Docker stack
        working-directory: infrastructure/docker
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up --build -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health | grep -q '"ok"'; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become healthy"
          exit 1

      - name: Run seed script (inside API container, bypasses CIMA)
        working-directory: infrastructure/docker
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            exec -T api uv run python /app/e2e/fixtures/seed.py --base-url http://localhost:8000/api

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Tear down Docker stack
        if: always()
        working-directory: infrastructure/docker
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            down -v

  # ============================================================
  # SonarQube analysis
  # Runs after api & web so it can collect their coverage reports.
  # Fails the CI run if the project's Quality Gate is red.
  # Requires these repository secrets:
  #   SONAR_HOST_URL  – URL of the SonarQube instance
  #   SONAR_TOKEN     – analysis token of a SonarQube user
  # ============================================================
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [api, web, e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history for blame/new-code detection
          fetch-depth: 0

      - name: Download API coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-api
          path: apps/api

      - name: Download Web coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-web
          path: apps/web/coverage

      - name: Download Mobile coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-mobile
          path: apps/mobile/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

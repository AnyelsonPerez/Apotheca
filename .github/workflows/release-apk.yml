name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/release-apk.yml'
      - '.npmrc'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Cancel in-progress builds on the same ref to save CI minutes
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Optimize Gradle properties (post-prebuild)
        working-directory: apps/mobile/android
        run: |
          # The android/ dir is generated by expo prebuild and is gitignored,
          # so we patch gradle.properties here to apply build optimizations.
          PROPS="gradle.properties"

          # Reduce ABIs from 4 to 2 (device-only: arm64-v8a + armeabi-v7a)
          # x86/x86_64 are emulator-only and halve native compilation time.
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' "$PROPS"

          # Increase JVM heap to avoid GC thrashing during New Arch C++ compilation
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' "$PROPS"

          # Enable Gradle build cache (configuration-cache is NOT compatible
          # with React Native's build.gradle which calls node during config phase)
          if grep -q "^org.gradle.caching=" "$PROPS"; then
            sed -i 's/^org.gradle.caching=.*/org.gradle.caching=true/' "$PROPS"
          else
            echo "org.gradle.caching=true" >> "$PROPS"
          fi

          echo "=== Final gradle.properties ==="
          cat "$PROPS"

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --build-cache --no-daemon --max-workers=4

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk artifact/apotheca.apk
          ls -lh artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apotheca-apk
          path: artifact/apotheca.apk
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest artifact/apotheca.apk \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest artifact/apotheca.apk \
              --title "Apotheca (latest)" \
              --notes "Latest APK build from \`main\` branch." \
              --repo "$GITHUB_REPOSITORY"
          fi

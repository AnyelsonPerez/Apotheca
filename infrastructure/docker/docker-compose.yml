services:
  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - apotheca-data:/app/data
    environment:
      - APOTHECA_DATABASE_PATH=/app/data/apotheca.db
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "49200:49200"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  apotheca-data:

server {
    listen 49200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to API
    location /auth/      { proxy_pass http://api:8000; }
    location /cima/      { proxy_pass http://api:8000; }
    location /inventory/ { proxy_pass http://api:8000; }
    location /settings/  { proxy_pass http://api:8000; }
    location /alerts/    { proxy_pass http://api:8000; }
    location /health     { proxy_pass http://api:8000; }
    location /docs       { proxy_pass http://api:8000; }
    location /openapi    { proxy_pass http://api:8000; }

    # APK downloads
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
    }
}

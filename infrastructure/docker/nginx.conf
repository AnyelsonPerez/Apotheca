server {
    listen 49200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to API
    location /api/      { proxy_pass http://api:8000/api/; }
    location /api       { proxy_pass http://api:8000/api; }

    # APK downloads
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
    }
}

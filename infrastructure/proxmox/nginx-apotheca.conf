# HTTP → HTTPS redirect
server {
    listen 80;
    server_name apotheca.anyelson.mywire.org;

    # Allow Let's Encrypt ACME challenge over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Apotheca web + API reverse proxy
server {
    listen 443 ssl;
    listen 49200 ssl;
    http2 on;
    server_name apotheca.anyelson.mywire.org;

    # Let's Encrypt certificates (adjust paths if certbot runs elsewhere)
    ssl_certificate     /etc/letsencrypt/live/apotheca.anyelson.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apotheca.anyelson.mywire.org/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/apotheca;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 301 /api/;
    }

    location /downloads/ {
        alias /var/www/apotheca/downloads/;
        types { application/vnd.android.package-archive apk; }
    }
}

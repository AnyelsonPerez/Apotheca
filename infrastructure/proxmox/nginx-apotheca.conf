# ──────────────────────────────────────────────────────────────
# Apotheca — nginx site config (HTTP by default, SSL optional)
#
# This config serves the SPA frontend and API reverse proxy over
# plain HTTP on ports 80 and 49200.  When SSL is configured via
# setup-ssl.sh, a separate apotheca-ssl.conf replaces this in
# sites-enabled and adds HTTPS + HTTP→HTTPS redirect.
# ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 49200;
    server_name _;

    root /var/www/apotheca;
    index index.html;

    # Allow Let's Encrypt ACME challenge over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 301 /api/;
    }

    # APK downloads
    location /downloads/ {
        alias /var/www/apotheca/downloads/;
        types { application/vnd.android.package-archive apk; }
    }
}
